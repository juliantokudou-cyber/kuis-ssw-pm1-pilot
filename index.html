/* =========================================
   MEMUAT PROGRES DARI LOCALSTORAGE
========================================= */

function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (
      saved &&
      Array.isArray(saved.answers) &&
      saved.answers.length === quizData.length
    ) {
      return {
        current:
          Number.isInteger(saved.current) &&
          saved.current >= 0 &&
          saved.current < quizData.length
            ? saved.current : 0,

        answers: saved.answers.map((answer, i) =>
          Number.isInteger(answer) &&
          answer >= 0 &&
          answer < quizData[i].options.length
            ? answer : null
        ),

        completed: saved.completed === true,

        timerEndTime:
          Number.isFinite(saved.timerEndTime) &&
          saved.timerEndTime > 0
            ? saved.timerEndTime : null
      };
    }
  } catch (error) {
    console.warn("Gagal memuat progres:", error);
  }

  return {
    current: 0,
    answers: Array(quizData.length).fill(null),
    completed: false,
    timerEndTime: null
  };
}

const restored = loadProgress();

let currentQuestionIndex = restored.current;
let selectedAnswers = restored.answers;
let quizCompleted = restored.completed;

// Jika timer pernah dibuat, gunakan batas waktu yang tersimpan.
let timerEndTime =
  restored.timerEndTime ?? (Date.now() + TIMER_DURATION);

let timerInterval = null;
let resultShown = false;
let timeExpired = false;

function saveProgress() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        current: currentQuestionIndex,
        answers: selectedAnswers,
        completed: quizCompleted,
        timerEndTime: timerEndTime
      })
    );
  } catch (error) {
    console.warn("Gagal menyimpan progres:", error);
  }
}

const quizBox = document.getElementById("quiz-box");

/* =========================================
   TAMPILKAN SOAL
========================================= */

function loadQuiz() {
  saveProgress();

  const q = quizData[currentQuestionIndex];
  const progress =
    ((currentQuestionIndex + 1) / quizData.length) * 100;

  const answered =
    selectedAnswers.filter(a => a !== null).length;

  const isLast =
    currentQuestionIndex === quizData.length - 1;

  quizBox.innerHTML = `
    <h1>Latihan Soal SSW PM 1</h1>

    <div id="timer" class="timer">
      Memuat waktu...
    </div>

    <div class="progress-bar">
      Soal ${currentQuestionIndex + 1} / ${quizData.length}
      &nbsp; | &nbsp; Terjawab ${answered}
    </div>

    <div class="progress-track">
      <div class="progress-fill" style="width:${progress}%"></div>
    </div>

    <div class="question">
      ${currentQuestionIndex + 1}. ${q.question}
    </div>

    <ul class="options-list">
      ${q.options.map((option, i) => `
        <li class="option-item">
          <button
            type="button"
            class="option-btn ${
              selectedAnswers[currentQuestionIndex] === i
                ? "selected" : ""
            }"
            data-option="${i}"
            aria-pressed="${
              selectedAnswers[currentQuestionIndex] === i
            }">
            ${option}
          </button>
        </li>
      `).join("")}
    </ul>

    <div class="navigation">
      <button
        type="button"
        id="prev-btn"
        class="action-btn btn-next"
        ${currentQuestionIndex === 0
          ? "disabled style='visibility:hidden'" : ""}>
        Kembali
      </button>

      <button
        type="button"
        id="next-btn"
        class="action-btn ${
          isLast ? "btn-submit" : "btn-next"
        }">
        ${isLast ? "Selesai & Lihat Hasil" : "Selanjutnya"}
      </button>
    </div>
  `;

  quizBox.querySelectorAll("[data-option]").forEach(button => {
    button.addEventListener("click", () => {
      selectOption(Number(button.dataset.option));
    });
  });

  document.getElementById("prev-btn")
    .addEventListener("click", prevQuestion);

  document.getElementById("next-btn")
    .addEventListener("click", nextQuestion);

  updateTimer();
}

/* =========================================
   PILIH JAWABAN DAN SIMPAN OTOMATIS
========================================= */

function selectOption(index) {
  if (quizCompleted || Date.now() >= timerEndTime) {
    updateTimer();
    return;
  }

  if (
    !Number.isInteger(index) ||
    index < 0 ||
    index >= quizData[currentQuestionIndex].options.length
  ) {
    return;
  }

  selectedAnswers[currentQuestionIndex] = index;

  saveProgress();
  loadQuiz();
}

/* =========================================
   NAVIGASI
========================================= */

function prevQuestion() {
  if (quizCompleted || Date.now() >= timerEndTime) {
    updateTimer();
    return;
  }

  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    saveProgress();
    loadQuiz();

    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function nextQuestion() {
  if (quizCompleted || Date.now() >= timerEndTime) {
    updateTimer();
    return;
  }

  if (selectedAnswers[currentQuestionIndex] === null) {
    Swal.fire({
      icon: "warning",
      title: "Jawaban belum dipilih",
      text: "Silakan pilih salah satu jawaban terlebih dahulu!",
      confirmButtonText: "Oke",
      confirmButtonColor: "#0d6efd",
      customClass: {
        popup: "swal-mobile-popup"
      }
    });

    return;
  }

  if (currentQuestionIndex < quizData.length - 1) {
    currentQuestionIndex++;
    saveProgress();
    loadQuiz();

    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    calculateScore();
  }
}

/* =========================================
   TIMER HITUNG MUNDUR
========================================= */

function updateTimer() {
  const timerElement = document.getElementById("timer");

  const remaining = Math.max(
    0,
    timerEndTime - Date.now()
  );

  const totalSeconds = Math.ceil(remaining / 1000);

  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  if (timerElement) {
    timerElement.textContent =
      `${hours} jam ${minutes} menit ${seconds} detik`;

    timerElement.classList.toggle(
      "warning",
      remaining > 0 &&
      remaining <= 10 * 60 * 1000
    );
  }

  // Waktu habis: akhiri kuis dan tampilkan hasil.
  if (remaining <= 0 && !quizCompleted) {
    timeExpired = true;
    quizCompleted = true;
    saveProgress();

    if (timerInterval !== null) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    showTimeExpired();
  }
}

function startTimer() {
  updateTimer();

  if (timerInterval !== null) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  if (!quizCompleted) {
    timerInterval = setInterval(updateTimer, 250);
  }
}

function showTimeExpired() {
  if (resultShown) return;

  resultShown = true;

  Swal.fire({
    icon: "info",
    title: "Waktu Habis!",
    text: "Waktu latihan telah berakhir. Hasil jawaban Anda akan ditampilkan.",
    confirmButtonText: "Lihat Hasil",
    confirmButtonColor: "#0d6efd",
    allowOutsideClick: false,
    allowEscapeKey: false,
    customClass: {
      popup: "swal-mobile-popup"
    }
  }).then(() => {
    calculateScore();
  });
}


/* =========================================
   HITUNG NILAI, KELULUSAN, WAKTU, DAN REVIEW
   Benar = 10 poin
   Salah/kosong = 0 poin
   Lulus = minimal 26 jawaban benar
========================================= */

function calculateScore() {
  if (timerInterval !== null) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  quizCompleted = true;
  saveProgress();

  // Hitung jumlah jawaban benar.
  const correctCount = quizData.reduce((total, q, i) => {
    return total + (
      selectedAnswers[i] === q.correct ? 1 : 0
    );
  }, 0);

  // Hitung skor.
  const finalScore = correctCount * 10;
  const maxScore = quizData.length * 10;

  // Batas kelulusan: minimal 26 jawaban benar.
  const passingScore = 26;
  const isPassed = correctCount >= passingScore;

  // Hitung waktu yang telah digunakan.
  // Tetap akurat jika kuis dilanjutkan setelah halaman ditutup.
  const durationSeconds = Math.floor(TIMER_DURATION / 1000);
  const remainingSeconds = Math.max(
    0,
    Math.ceil((timerEndTime - Date.now()) / 1000)
  );

  const elapsedSeconds = Math.min(
    durationSeconds,
    Math.max(0, durationSeconds - remainingSeconds)
  );

  const elapsedMinutes = Math.floor(elapsedSeconds / 60);
  const elapsedRemainderSeconds = elapsedSeconds % 60;

  const elapsedText =
    `${elapsedMinutes} menit ${elapsedRemainderSeconds} detik`;

  // Hitung jawaban yang belum dijawab.
  const unansweredCount = selectedAnswers.filter(
    answer => answer === null
  ).length;

  const wrongCount = quizData.length
    - correctCount
    - unansweredCount;

  // Buat review seluruh soal.
  const reviewHTML = quizData.map((q, i) => {
    const correct = selectedAnswers[i] === q.correct;

    const chosen = selectedAnswers[i] === null
      ? "Tidak dijawab"
      : q.options[selectedAnswers[i]];

    const answerKey = q.options[q.correct];

    return `
      <div class="review-item ${
        correct ? "correct" : "wrong"
      }">
        <div class="review-q">
          ${i + 1}. ${q.question}

          <span class="${
            correct ? "text-success" : "text-danger"
          }">
            ${
              correct
                ? "✓ Benar (+10 poin)"
                : "✗ Salah (+0 poin)"
            }
          </span>
        </div>

        <div>
          Jawaban Anda:
          <strong>${chosen}</strong>
        </div>

        ${!correct ? `
          <div>
            Kunci jawaban:
            <strong class="text-success">${answerKey}</strong>
          </div>
        ` : ""}
      </div>
    `;
  }).join("");

  // Tampilkan hasil akhir.
  quizBox.innerHTML = `
    <div class="result-screen">

      <h1>
        ${timeExpired ? "Waktu Habis!" : "Kuis Selesai!"}
      </h1>

      <div class="${isPassed ? "pass-status" : "fail-status"}">
        ${isPassed ? "🎉 LULUS" : "TIDAK LULUS"}
      </div>

      <p>
        ${
          isPassed
            ? "Selamat! Anda memenuhi batas kelulusan."
            : "Belum lulus. Tetap semangat dan coba berlatih kembali."
        }
      </p>

      <p>Skor Anda:</p>

      <div class="score-box">${finalScore}</div>

      <p>
        dari maksimal <strong>${maxScore}</strong> poin.
      </p>

      <div class="completion-info">
        <div>
          <strong>Jawaban benar:</strong>
          ${correctCount} dari ${quizData.length} soal
        </div>

        <div>
          <strong>Jawaban salah:</strong>
          ${wrongCount} soal
        </div>

        <div>
          <strong>Batas lulus:</strong>
          minimal ${passingScore} jawaban benar
        </div>

        <div>
          <strong>Waktu penyelesaian:</strong>
          ${elapsedText}
        </div>
      </div>

      <button
        type="button"
        class="action-btn btn-next"
        id="reset-btn">
        Ulangi Latihan
      </button>

      <section class="review-section">
        <h2>Review Jawaban</h2>
        ${reviewHTML}
      </section>

    </div>
  `;

  document.getElementById("reset-btn")
    .addEventListener("click", resetQuiz);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =========================================
   ULANGI KUIS
========================================= */

function resetQuiz() {
  Swal.fire({
    icon: "question",
    title: "Ulangi latihan?",
    text: "Jawaban dan waktu sebelumnya akan dihapus. Timer kembali ke 1 jam 30 menit.",
    showCancelButton: true,
    confirmButtonText: "Ya, ulangi",
    cancelButtonText: "Batal",
    confirmButtonColor: "#198754",
    cancelButtonColor: "#6c757d",
    reverseButtons: true,
    customClass: {
      popup: "swal-mobile-popup"
    }
  }).then(result => {
    if (!result.isConfirmed) return;

    if (timerInterval !== null) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    currentQuestionIndex = 0;
    selectedAnswers = Array(quizData.length).fill(null);
    quizCompleted = false;
    resultShown = false;
    timeExpired = false;

    timerEndTime = Date.now() + TIMER_DURATION;

    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      console.warn("Gagal menghapus progres:", error);
    }

    saveProgress();
    loadQuiz();
    startTimer();

    window.scrollTo({ top: 0, behavior: "smooth" });

    Swal.fire({
      icon: "success",
      title: "Kuis Diulang",
      text: "Silakan mulai menjawab dari soal pertama.",
      confirmButtonText: "Mulai",
      confirmButtonColor: "#0d6efd",
      customClass: {
        popup: "swal-mobile-popup"
      }
    });
  });
}

/* Simpan progres saat halaman akan ditinggalkan. */
window.addEventListener("pagehide", saveProgress);

/* =========================================
   MULAI / PULIHKAN KUIS
========================================= */

if (quizCompleted) {
  calculateScore();
} else {
  loadQuiz();
  startTimer();
}
</script>
</body>
</html>
