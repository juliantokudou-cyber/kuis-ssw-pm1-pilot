* {

body {

}

.quiz-container {

}

h2 {

  margin-bottom: 20px;
  color: #2c3e50;
}

.progress-bar {

  color: #666;
  margin-bottom: 10px;
  text-align: right;
  font-weight: bold;
}

.progress-track {
  height: 7px;
  background: #e9ecef;
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-fill {
  height: 100%;
  background: #0d6efd;
  transition: width .2s;
}

.question {
  font-size: 1.15rem;
  margin-bottom: 15px;
  font-weight: 600;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.q-image {
  width: 100%;
  max-height: 360px;
  object-fit: contain;
  border-radius: 8px;
  margin-bottom: 15px;
  display: block;
}

.opt-image {
  max-width: 200px;
  max-height: 150px;
  object-fit: contain;
  border-radius: 6px;
  margin: 8px 0;
  display: block;
}

audio {
  width: 100%;
  margin: 8px 0;
  display: block;
}

.options-list {
  list-style: none;
}

.option-item {
  margin-bottom: 12px;
}

.option-btn {
  width: 100%;
  padding: 15px;
  font-size: 1rem;
  text-align: left;
  background: #f8f9fa;
  border: 2px solid #e9ecef;
  border-radius: 8px;
  cursor: pointer;
  transition: all .2s;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.option-btn:hover {
  background: #e2e6ea;
}

.option-btn.selected {
  background: #e7f1ff;
  border-color: #0d6efd;
  color: #0d6efd;
  font-weight: 600;
}

.option-btn:focus-visible,
.action-btn:focus-visible {
  outline: 3px solid #ffc107;
  outline-offset: 2px;
}

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 30px;
}

.action-btn {
  padding: 12px 22px;
  font-size: 1rem;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.btn-next {
  background: #0d6efd;
  color: white;
}

.btn-next:hover {
  background: #0b5ed7;
}

.btn-submit {
  background: #198754;
  color: white;
}

.btn-submit:hover {
  background: #157347;
}

.result-screen {
  text-align: center;
}

.score-box {
  font-size: 3rem;
  font-weight: bold;
  color: #198754;
  margin: 15px 0;
}

.review-section {
  text-align: left;
  margin-top: 30px;
  border-top: 2px dashed #ddd;
  padding-top: 20px;
}

.review-item {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 15px;
  border-left: 5px solid #ccc;
  overflow-wrap: anywhere;
}

.review-item.correct {
  border-left-color: #198754;
  background: #f1f9f5;
}

.review-item.wrong {
  border-left-color: #dc3545;
  background: #fdf3f4;
}

.review-q {
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.6;
}

.review-ans {
  font-size: .95rem;
  margin-bottom: 6px;
  line-height: 1.5;

.text-success {
  color: #198754;
  font-weight: bold;
}

.text-danger {
  color: #dc3545;
  font-weight: bold;
}

.review-media {
  max-width: 100%;
  margin-top: 8px;

.save-status {
  font-size: .85rem;
  text-align: center;
  color: #198754;
  margin-top: 15px;

@media(max-width:480px) {
  body {

  .option-btn {

    font-size: .95rem;
  }

  .action-btn {
    padding: 11px 14px;
    font-size: .9rem;
  }

</style>
</head>

      { text: "C. 清潔作業区域(せいけつさぎょうくいき)" }
    ],
    correct: 2
  },
  {
    question: "作業服(さぎょうふく)を正(ただ)しく着用(ちゃくよう)するとき、間違(まちが)っている方法はどれですか。",
    options: [
      { text: "A. マスクから鼻(はな)が出ないようにする" },
      { text: "B. 帽子(ぼうし)から髪(かみ)の毛(け)が出ないように深くかぶる" },
      { text: "C. 作業場(さぎょうじょう)が暑(あつ)いときは、袖(そで)をまくって作業する" }
    ],
    correct: 2
  },
  {
    question: "細菌(さいきん)が増(ふ)えるために必要(ひつよう)な「3つの要素(ようそ)」は何(なん)ですか。",
    options: [
      { text: "A. 温度(おんど)、水分(すいぶん)、栄養(えいよう)" },
      { text: "B. 塩分(えんぶん)、糖分(とうぶん)、油分(ゆぶん)" },
      { text: "C. 空気(くうき)、日光(にっこう)、土(つち)" }
    ],
    correct: 0
  },
  {
    question: "正(ただ)しい手洗い(てあらい)の方法(ほうほう)で、せっけんをつけてよく洗(あら)う時間(じかん)の目安(めやす)はどのくらいですか。",
    options: [
      { text: "A. 5秒間(びょうかん)程度(ていど)" },
      { text: "B. 30秒間(びょうかん)程度(ていど)" },
      { text: "C. 5分間(ふんかん)程度(ていど)" }
    ],
    correct: 1
  },
  {
    question: "手(て)を洗(あら)ったあと、アルコールで消毒(しょうどく)する前の工程(こうてい)として正しいものはどれですか。",
    options: [
      { text: "A. すぐにアルコールを吹き付ける" },
      { text: "B. 使い捨てのペーパータオルまたはエアータオルで、手を乾かす(かわかす)" },
      { text: "C. 作業服(さぎょうふく)で手を拭(ふ)いてからアルコールをつける" }
    ],
    correct: 1
  }
];

const quizBox = document.getElementById("quiz-box");

/* =========================
   LOCALSTORAGE
========================= */

// Memuat jawaban dan nomor soal yang tersimpan
function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (
      saved &&
      Array.isArray(saved.answers) &&
      saved.answers.length === quizData.length
    ) {
      const restoredAnswers = saved.answers.map((answer, index) => {
        if (
          Number.isInteger(answer) &&
          answer >= 0 &&
          answer < quizData[index].options.length
        ) {
          return answer;
        }
        return null;
      });

      const restoredIndex =
        Number.isInteger(saved.current) &&
        saved.current >= 0 &&
        saved.current < quizData.length
          ? saved.current
          : 0;

      return {
        current: restoredIndex,
        answers: restoredAnswers,
        completed: saved.completed === true
      };
    }
  } catch (error) {
    console.warn("Gagal memuat progres:", error);
  }

  return {
    current: 0,
    answers: Array(quizData.length).fill(null),
    completed: false
  };
}

// Menyimpan semua progres kuis
function saveProgress() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        current: currentQuestionIndex,
        answers: selectedAnswers,
        completed: quizCompleted
      })
    );
  } catch (error) {
    console.warn("Gagal menyimpan progres:", error);
  }
}

const savedProgress = loadProgress();

let currentQuestionIndex = savedProgress.current;
let selectedAnswers = savedProgress.answers;
let quizCompleted = savedProgress.completed;

/* =========================
   FUNGSI BANTUAN
========================= */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

function mediaHTML(image, audio, imageClass) {
  let html = "";

  if (image) {
    html += `<img class="${imageClass}" src="${escapeHTML(image)}" alt="Media soal" loading="lazy">`;
  }

  if (audio) {
    html += `<audio controls preload="none" src="${escapeHTML(audio)}">Browser Anda tidak mendukung audio.</audio>`;
  }

  return html;
}

/* =========================
   MENAMPILKAN SOAL
========================= */

function loadQuiz() {
  if (!quizData.length) {
    quizBox.innerHTML = "<h2>Tidak ada soal</h2>";
    return;
  }

  // Simpan posisi dan jawaban setiap kali soal ditampilkan
  saveProgress();

  const q = quizData[currentQuestionIndex];
  const last = currentQuestionIndex === quizData.length - 1;
  const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
  const answeredCount = selectedAnswers.filter(a => a !== null).length;

  quizBox.innerHTML = `
    <h2>Latihan Food Safety &amp; Sanitasi</h2>

    <div class="progress-bar">
      Soal ${currentQuestionIndex + 1} / ${quizData.length}
      &nbsp; | &nbsp;
      Terjawab ${answeredCount}
    </div>

    <div class="progress-track"
         role="progressbar"
         aria-valuemin="0"
         aria-valuemax="100"
         aria-valuenow="${Math.round(progress)}">
      <div class="progress-fill" style="width:${progress}%"></div>
    </div>

    <div class="question">
      ${currentQuestionIndex + 1}. ${escapeHTML(q.question)}
    </div>

    ${mediaHTML(q.qImage, q.qAudio, "q-image")}

    <ul class="options-list">
      ${q.options.map((opt, i) => `
        <li class="option-item">
          <button
            type="button"
            class="option-btn ${selectedAnswers[currentQuestionIndex] === i ? "selected" : ""}"
            data-option="${i}"
            aria-pressed="${selectedAnswers[currentQuestionIndex] === i}">
            ${escapeHTML(opt.text)}
            ${mediaHTML(opt.image, opt.audio, "opt-image")}
          </button>
        </li>
      `).join("")}
    </ul>

    <div class="navigation">
      <button
        type="button"
        class="action-btn btn-next"
        id="prev-btn"
        ${currentQuestionIndex === 0 ? "disabled style='visibility:hidden'" : ""}>
        Kembali
      </button>

      <button
        type="button"
        class="action-btn ${last ? "btn-submit" : "btn-next"}"
        id="next-btn">
        ${last ? "Selesai & Lihat Hasil" : "Selanjutnya"}
      </button>
    </div>

    <p class="save-status">
      ✓ Jawaban tersimpan otomatis di browser
    </p>
  `;

  quizBox.querySelectorAll("[data-option]").forEach(btn => {
    btn.addEventListener("click", () => {
      selectOption(Number(btn.dataset.option));
    });
  });

  document.getElementById("prev-btn")
    .addEventListener("click", prevQuestion);

  document.getElementById("next-btn")
    .addEventListener("click", nextQuestion);
}

/* =========================
   MEMILIH JAWABAN
========================= */

function selectOption(index) {
  if (
    !Number.isInteger(index) ||
    index < 0 ||
    index >= quizData[currentQuestionIndex].options.length
  ) {
    return;
  }

  selectedAnswers[currentQuestionIndex] = index;

  // Langsung simpan begitu jawaban dipilih
  saveProgress();

  // Perbarui tampilan pilihan jawaban
  loadQuiz();
}

/* =========================
   NAVIGASI SOAL
========================= */

function prevQuestion() {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    saveProgress();
    loadQuiz();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }
}

function nextQuestion() {
  if (selectedAnswers[currentQuestionIndex] === null) {
    alert("Silakan pilih salah satu jawaban terlebih dahulu!");
    return;
  }

  if (currentQuestionIndex < quizData.length - 1) {
    currentQuestionIndex++;
    saveProgress();
    loadQuiz();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  } else {
    calculateScore();
  }
}

/* =========================
   HASIL DAN REVIEW
========================= */

function calculateScore() {
  quizCompleted = true;
  saveProgress();

  const score = quizData.reduce((sum, q, i) => {
    return sum + (selectedAnswers[i] === q.correct ? 1 : 0);
  }, 0);

  const finalScore = Math.round(score / quizData.length * 100);

  const reviewHTML = quizData.map((q, i) => {
    const correct = selectedAnswers[i] === q.correct;

    const chosen = selectedAnswers[i] === null
      ? "Tidak dijawab"
      : q.options[selectedAnswers[i]].text;

    const right = q.options[q.correct].text;

    return `
      <div class="review-item ${correct ? "correct" : "wrong"}">
        <div class="review-q">
          ${i + 1}. ${escapeHTML(q.question)}
          <span class="${correct ? "text-success" : "text-danger"}">
            ${correct ? "✓ Benar" : "✗ Salah"}
          </span>
        </div>

        ${mediaHTML(q.qImage, q.qAudio, "review-media")}

        <div class="review-ans">
          Jawaban Anda:
          <strong>${escapeHTML(chosen)}</strong>
        </div>

        ${!correct ? `
          <div class="review-ans">
            Kunci jawaban:
            <strong class="text-success">${escapeHTML(right)}</strong>
          </div>
        ` : ""}
      </div>
    `;
  }).join("");

  quizBox.innerHTML = `
    <div class="result-screen">
      <h2>Kuis Selesai!</h2>

      <p>Nilai Anda:</p>

      <div class="score-box">${finalScore}</div>

      <p>
        Benar <strong>${score}</strong>
        dari <strong>${quizData.length}</strong> soal.
      </p>

      <br>

      <button type="button"
              class="action-btn btn-next"
              id="reset-btn">
        🔄 Ulangi Latihan
      </button>

      <section class="review-section">
        <h3>📋 Review Jawaban</h3>
        <br>
        ${reviewHTML}
      </section>
    </div>
  `;

  document.getElementById("reset-btn")
    .addEventListener("click", resetQuiz);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =========================
   MENGULANG KUIS
========================= */

function resetQuiz() {
  const confirmed = confirm(
    "Ulangi latihan dari awal? Semua jawaban sebelumnya akan dihapus."
  );

  if (!confirmed) {
    return;
  }

  currentQuestionIndex = 0;
  selectedAnswers = Array(quizData.length).fill(null);
  quizCompleted = false;

  // Hapus progres lama dari localStorage
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    console.warn("Gagal menghapus progres:", error);
  }

  // Simpan kondisi kuis yang baru dan kosong
  saveProgress();
  loadQuiz();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =========================
   MULAI / PULIHKAN KUIS
========================= */

// Jika sebelumnya sudah selesai, langsung tampilkan hasil lagi
if (quizCompleted) {
  calculateScore();
} else {
  loadQuiz();
}

// Simpan progres saat halaman akan ditinggalkan
window.addEventListener("pagehide", saveProgress);
</script>
</body>
</html>
